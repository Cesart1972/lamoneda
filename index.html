<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Moneda Mayorista</title>
  <meta id="description" name="description" content="Catálogo digital · Líderes en precios bajos">

  <!-- VISTA PREVIA AL COMPARTIR EL LINK (WhatsApp, Facebook, etc.)
       WhatsApp no ejecuta JavaScript: estos datos tienen que estar
       escritos acá y no en cliente/config.js. Cambiarlos por cada cliente.
       La imagen y la URL deben ser direcciones completas (https://...). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="La Moneda Mayorista">
  <meta property="og:title" content="La Moneda Mayorista · Catálogo">
  <meta property="og:description" content="Líderes en precios bajos. Mirá el catálogo y hacé tu pedido por WhatsApp.">
  <meta property="og:url" content="https://cesart1972.github.io/lamoneda/">
  <meta property="og:image" content="https://cesart1972.github.io/lamoneda/cliente/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta id="themeColor" name="theme-color" content="">
  <link id="favicon" rel="icon" href="">

  <!-- PWA: instalación como aplicación (datos en la carpeta cliente/) -->
  <link rel="manifest" href="cliente/manifest.json">
  <link rel="apple-touch-icon" href="cliente/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta id="appleTitle" name="apple-mobile-web-app-title" content="">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/bienvenida.css">
  <link rel="stylesheet" href="css/carrito.css">

  <!-- Letra redondeada para la bienvenida (si no carga, se usa la del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">

  <!-- Configuración del cliente: va primero para aplicar colores sin parpadeo -->
  <script src="cliente/config.js"></script>
  <script src="js/cliente.js"></script>
</head>
<main class="app"> 
<!-- ================= HEADER SUPERIOR (NO STICKY) ================= -->

<header class="topHeader">
  <!-- Logo -->
  <div class="logoContainer">
    <a href="#" class="logoLink">
      <img id="logoEmpresa"
       class="logoEmpresa"
       alt="Logo de la empresa">
    </a>
  </div>

  <!-- Título -->
  <div class="titleContainer">
      <h1 id="tituloCatalogo" class="catalogTitle"></h1>
  </div>

  <!-- Botones del encabezado: Información y Compartir -->
  <div class="headerAcciones">

    <button id="btnInfo" class="btn-header" type="button" aria-label="Información">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"></circle>
        <circle cx="12" cy="7.6" r="1.5"></circle>
        <rect x="10.8" y="10.4" width="2.4" height="7" rx="1.2"></rect>
      </svg>
      <span>Info</span>
    </button>

    <button id="btnCompartir" class="btn-header btn-compartir" type="button" aria-label="Compartir">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17 8.5 7 12l10 3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>
        <circle cx="18" cy="5.5" r="3.2"></circle>
        <circle cx="6" cy="12" r="3.2"></circle>
        <circle cx="18" cy="18.5" r="3.2"></circle>
      </svg>
      <span>Compartir</span>
    </button>

  </div>
</header>


<!-- ================= MODAL COMPARTIR ================= -->

<div id="modalCompartir" class="modal-compartir">

  <div class="modal-compartir-contenido">

    <button
      id="cerrarCompartir"
      class="cerrar-modal"
      aria-label="Cerrar"
    >
      &times;
    </button>

    <h2>Invitar amigos</h2>

    <div class="compartir-opciones">

      <div class="opcion-compartir">

        <h3>Escaneá el código QR</h3>

        <div id="qrCompartir"></div>

        <p>
          Escaneá este código con tu celular
          para abrir la aplicación.
        </p>

      </div>

      <div class="separador">
        <span>o</span>
      </div>

      <div class="opcion-link">

        <button
          id="btnCopiarLink"
          class="btn-link-compartir"
        >
          <span>🔗</span>
          Link para compartir
        </button>

      </div>

    </div>

  </div>

</div>

<div id="toastCompartir" class="toast-compartir"></div>


<!-- ================= BUSCADOR (STICKY) ================= -->

<body>

    <section class="toolbar" aria-label="Busqueda de productos">

      <div class="searchContainer">

        <label class="searchBox">
      
          <span class="searchIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="m21 21-4.4-4.4m1.4-5.1a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
            </svg>
          </span>
      
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Busca... Marca + Productos"
          >

          <button
            type="button"
            id="clearSearchBtn"
            class="clearSearchBtn hidden"
            aria-label="Limpiar búsqueda"
            title="Limpiar búsqueda"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 8l8 8M16 8l-8 8"></path>
            </svg>
          </button>

          <button
            type="button"
            id="voiceSearchBtn"
            class="voiceSearchBtn"
            aria-label="Buscar por voz"
            title="Buscar por voz"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/>
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
              <path d="M12 17.5V21"/>
              <path d="M8.5 21h7"/>
            </svg>
          </button>
      
        </label>

        <div
          id="searchSuggestions"
          class="searchSuggestions"
          hidden
        ></div>

<!--
  <button id="filterToggleBtn" class="filterToggleBtn headericon" aria-label="Filtros avanzados">
    <svg viewBox="0 0 24 24" role="img">
      <path d="M3 7h10M17 7h4M3 12h4M11 12h10M3 17h14M21 17h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="15" cy="7" r="2" stroke="currentColor" stroke-width="2" fill="#fff"/>
      <circle cx="9" cy="12" r="2" stroke="currentColor" stroke-width="2" fill="#fff"/>
      <circle cx="19" cy="17" r="2" stroke="currentColor" stroke-width="2" fill="#fff"/>
    </svg>
  </button>
</div>
-->

</section>


    <section class="summary" aria-live="polite">
      <strong id="resultCount">0 productos</strong>
      <span id="activeQuery">Mostrando toda la lista</span>
    </section>


    <section
      id="productGrid"
      class="productGrid"
      aria-label="Productos"
    ></section>


    <section id="emptyState" class="emptyState" hidden>
      <h2>No encontramos productos</h2>
      <p>Prueba con otra marca, categoria o palabra clave.</p>
    </section>

  </main>


  <template id="productTemplate">

    <article class="productCard">

      <div class="ribbonContainer" hidden>
        <span class="ribbonText"></span>
      </div>

      <img class="productImage" alt="">

      <div class="productInfo">

        <h2 class="name"></h2>

        <strong class="price"></strong>

        <div class="purchaseActions">

          <button class="addBtn">
            Agregar
          </button>

          <div class="counterControls" hidden>

            <button
              class="minusBtn"
              aria-label="Disminuir cantidad"
            >
              −
            </button>

            <span class="quantityValue">
              0
            </span>

            <button
              class="plusBtn"
              aria-label="Aumentar cantidad"
            >
              +
            </button>

          </div>

        </div>

      </div>

    </article>

  </template>


  <!-- MODAL LATERAL DE FILTROS AVANZADOS -->

  <div id="filterModal" class="modalOverlay" hidden>

    <div class="modalSidebar">

      <header class="modalHeader">

        <h2>Filtrar por:</h2>

        <button
          id="closeFilterBtn"
          class="closeModalBtn"
          aria-label="Cerrar filtros"
        >
          ✕
        </button>

      </header>


      <div class="modalContent">

        <!-- Los grupos de filtros se crean desde cliente/config.js (js/cliente.js) -->

        <button
          id="clearFiltersBtn"
          class="clearFiltersBtn"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>

          Limpiar filtros

        </button>

      </div>

    </div>

  </div>


<!-- ================= CHECKOUT ================= -->

<footer
  id="orderFooter"
  class="orderFooter hidden"
>

  <button
    id="checkoutBtn"
    class="orderSummaryBtn"
    type="button"
  >

    <span class="orderText">
      Ver pedido
    </span>

    <span
      id="orderTotal"
      class="orderTotal"
    >
      $0
    </span>

  </button>

  <!-- Se oculta solo cuando el pedido supera la compra mínima (js/carrito.js) -->
  <p id="avisoMinimoFooter" class="avisoMinimo" hidden></p>

</footer>


<!-- ================= WHATSAPP ================= -->

<a
  id="whatsappBtn"
  class="floatingWhatsApp"
  href="#"
  target="_blank"
  aria-label="Consultar por WhatsApp"
>

  <svg
    class="whatsappIcon"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.746.953 3.71 1.456 5.707 1.456h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"/>
  </svg>

</a>


<!-- ================= SCRIPTS ================= -->


<!-- Los datos siempre llegan actualizados gracias al service worker (sw.js) -->
<script src="products-data.js"></script>
<script src="js/datos.js"></script>

<script src="js/search-engine-v1.js"></script>
<script src="js/formas-compra.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="app.js"></script>
<script src="js/carrito.js"></script>
<script src="voiceSearch.js"></script>
<script src="js/share.js"></script>
<script src="js/bienvenida.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
