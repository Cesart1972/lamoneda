<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosys</title>
<meta name="description" content="Dosys: catálogo de ventas y toma de pedidos para distribuidoras.">
<style>
  :root { --fondo: #f6f5f2; --texto: #1d1d1b; --suave: #6b6a66; --acento: #e8641b; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #161614; --texto: #f2f1ed; --suave: #a5a39d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--fondo); color: var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: clamp(2.6rem, 9vw, 4rem); margin: 0 0 8px; letter-spacing: -0.03em; }
  h1 span { color: var(--acento); }
  p { font-size: 1.1rem; line-height: 1.5; color: var(--suave); margin: 0 0 8px; }
  small { display: block; margin-top: 32px; color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>Dosys<span>.</span></h1>
  <p>Catálogo de ventas, toma de pedidos y armado para distribuidoras.</p>
  <p>Muy pronto, más información.</p>
  <small>© Ces.Art</small>
</main>
</body>
</html>
